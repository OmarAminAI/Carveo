global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development
    project: carveo

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: carveo-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: carveo-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9191"]

  - job_name: carveo-beat
    metrics_path: /metrics
    static_configs:
      - targets: ["beat:9108"]

  - job_name: crawl4ai
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/crawl4ai-token
    static_configs:
      - targets: ["crawl4ai:11235"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:8000/ready
          - http://web:3000/api/ready
          - http://crawl4ai:11235/health
          - http://prometheus:9090/-/ready
          - http://grafana:3000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
