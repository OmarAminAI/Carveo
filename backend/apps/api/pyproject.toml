[project]
name = "carveo-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "carveo-core",
  "fastapi>=0.141,<0.142",
  "prometheus-client>=0.22,<1",
  "pydantic-settings>=2.10,<3",
  "python-json-logger>=3.3,<4",
  "uvicorn[standard]>=0.35,<1",
]

[tool.uv.sources]
carveo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carveo_api"]
