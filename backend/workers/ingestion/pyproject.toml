[project]
name = "carveo-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "carveo-core",
  "dramatiq[redis]>=2.2,<3",
  "redis>=6.4,<7",
]

[tool.uv.sources]
carveo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carveo_worker"]
