[project]
name = "carveo-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "apscheduler>=3.11,<4",
  "carveo-core",
  "dramatiq[prometheus,redis]>=2.2,<3",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "prometheus-client>=0.22,<1",
  "python-json-logger>=3.3,<4",
  "redis>=6.4,<7",
]

[tool.uv.sources]
carveo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carveo_worker"]
