services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carveo
      POSTGRES_USER: carveo
      POSTGRES_PASSWORD: carveo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carveo -d carveo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      CARVEO_DATABASE_URL: postgresql+psycopg://carveo:carveo@postgres:5432/carveo
      CARVEO_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: workers/ingestion/Dockerfile
    environment:
      CARVEO_REDIS_URL: redis://redis:6379/0
      CARVEO_WORKER_MODE: idle
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:

